name: Go lint and test

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        default: "1.26"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - run: go vet ./...
      - run: go test ./...
